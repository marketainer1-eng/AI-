<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전문가·강사 | 자기분야</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="자기분야가 칼럼과 인터뷰로 소개한 전문가와 강사를 분야별로 찾아보세요.">
<meta property="og:site_name" content="자기분야">
<meta property="og:title" content="전문가·강사 | 자기분야">
<meta property="og:description" content="자기분야가 칼럼과 인터뷰로 소개한 전문가와 강사를 분야별로 찾아보세요.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="experts.html">
<header id="site-header" class="site-header"></header>
<main id="main">
<section class="page-head">
  <div class="wrap">
    <nav class="crumbs" aria-label="현재 위치"><a href="index.html">홈</a><span aria-hidden="true">/</span><span>전문가·강사</span></nav>
    <span class="label">자기분야가 소개한 전문가</span>
    <h1 class="hl">전문가·강사</h1>
    <p>자기분야에 칼럼과 인터뷰로 소개된 전문가입니다. 프로필에서 강의 주제를 확인하고 강의와 자문을 요청할 수 있습니다.</p>
  </div>
</section>
<section class="block">
  <div class="wrap">
    <div class="toolbar">
      <div class="filters" role="group" aria-label="분야로 거르기" id="filters"></div>
      <label class="find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr-only">전문가 검색</span><input id="q" type="search" placeholder="분야, 강의 주제로 검색"></label>
    </div>
    <p class="count" id="count" role="status"></p>
    <div class="ex-grid" id="ex-grid"></div>
    <p class="empty" id="ex-empty" hidden>조건에 맞는 전문가가 없습니다. 다른 분야를 선택하거나 검색어를 바꿔 보세요.</p>
  </div>
</section>
<section class="cta-band">
  <div class="wrap">
    <div><h2 class="hl">찾는 분야의 전문가가 없나요?</h2><p>원하는 주제를 알려 주시면 맞는 전문가를 찾아 연결해 드립니다.</p></div>
    <div class="ctas"><a class="btn primary" href="contact.html#lecture">강사 섭외 문의</a><a class="btn" href="contact.html#join">전문가로 참여하기</a></div>
  </div>
</section>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="assets/experts.js"></script>
<script src="assets/site.js"></script>
<script>
(function () {
  var all = window.EXPERTS, F = window.EXPERT_FIELDS, cur = "all";
  var grid = document.getElementById("ex-grid"), q = document.getElementById("q");
  var chips = [["all", "전체"]].concat(Object.keys(F).map(function (k) { return [k, F[k]]; }));
  document.getElementById("filters").innerHTML = chips.map(function (c) {
    return '<button class="chip" type="button" data-f="' + c[0] + '" aria-pressed="' + (c[0] === "all") + '">' + c[1] + "</button>";
  }).join("");
  function render() {
    var term = q.value.trim().toLowerCase();
    var list = all.filter(function (e) {
      if (cur !== "all" && e.field !== cur) return false;
      if (!term) return true;
      var hay = [e.name, e.role, F[e.field], e.summary].concat(e.topics.map(function (t) { return t.title; })).join(" ").toLowerCase();
      return hay.indexOf(term) > -1;
    });
    grid.innerHTML = list.map(window.expertCard).join("");
    document.getElementById("count").textContent = "전문가 " + list.length + "명";
    document.getElementById("ex-empty").hidden = list.length > 0;
  }
  document.getElementById("filters").addEventListener("click", function (ev) {
    var b = ev.target.closest(".chip"); if (!b) return;
    cur = b.getAttribute("data-f");
    this.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", c === b ? "true" : "false"); });
    render();
  });
  q.addEventListener("input", render);
  render();
})();
</script>
</body>
</html>
