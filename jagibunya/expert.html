<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전문가 프로필 | 자기분야</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="자기분야가 소개한 전문가의 프로필과 강의 주제입니다.">
<meta property="og:site_name" content="자기분야">
<meta property="og:title" content="전문가 프로필 | 자기분야">
<meta property="og:description" content="자기분야가 소개한 전문가의 프로필과 강의 주제입니다.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="expert.html">
<header id="site-header" class="site-header"></header>
<main id="main">
<section class="page-head">
  <div class="wrap">
    <nav class="crumbs" aria-label="현재 위치"><a href="index.html">홈</a><span aria-hidden="true">/</span><a href="experts.html">전문가·강사</a><span aria-hidden="true">/</span><span id="crumb">프로필</span></nav>
    <div class="profile" id="profile"></div>
  </div>
</section>
<section class="block">
  <div class="wrap detail-grid" id="detail"></div>
</section>
<section class="block alt">
  <div class="wrap">
    <div class="sec-head"><div><span class="label">다른 전문가</span><h2 class="hl">함께 소개된 전문가</h2></div><a class="more" href="experts.html">전체 보기 →</a></div>
    <div class="ex-grid" id="others"></div>
  </div>
</section>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="assets/experts.js"></script>
<script src="assets/site.js"></script>
<script>
(function () {
  var all = window.EXPERTS, F = window.EXPERT_FIELDS, esc = window.esc;
  function sec(title, html) { return html ? "<section><h2>" + title + "</h2>" + html + "</section>" : ""; }
  function render() {
    var id = decodeURIComponent(location.hash.slice(1));
    var e = all.filter(function (x) { return x.id === id; })[0] || all[0];
    document.title = e.name + " · " + e.role + " | 자기분야";
    document.getElementById("crumb").textContent = e.name;
    document.getElementById("profile").innerHTML =
      window.expertAvatar(e, "lg") + "<div>" +
      '<span class="label">' + esc(F[e.field]) + "</span>" +
      '<h1 class="hl">' + esc(e.name) + "</h1>" +
      '<div class="role">' + esc(e.role) + "</div>" +
      (e.org ? '<div class="p-org">' + esc(e.org) + "</div>" : "") +
      '<div class="stats">' + window.expertStats(e) + "</div></div>";
    var list = function (arr, fn) { return arr && arr.length ? arr.map(fn).join("") : ""; };
    document.getElementById("detail").innerHTML =
      "<div>" +
        sec("소개", '<p class="prose" style="margin:0">' + esc(e.summary) + "</p>") +
        sec("강의 분야", list(e.topics, function (t) {
          return '<div class="lecture"><b>' + esc(t.title) + "</b>" + (t.target ? "<span>대상: " + esc(t.target) + "</span>" : "") + "</div>";
        })) +
        sec("주요 경력", e.career && e.career.length ? '<ul class="timeline">' + list(e.career, function (c) {
          return '<li><span class="p">' + esc(c[0]) + '</span><span class="t">' + esc(c[1]) + "</span></li>";
        }) + "</ul>" : "") +
        sec("주요 강의·협업 기관", e.orgs && e.orgs.length ? '<div class="org-tags">' + list(e.orgs, function (o) { return "<span>" + esc(o) + "</span>"; }) + "</div>" : "") +
        sec("저서", e.books && e.books.length ? '<ul class="book-list">' + list(e.books, function (b) {
          return '<li><span class="y">' + esc(b[0]) + "</span><span>" + esc(b[1]) + "</span></li>";
        }) + "</ul>" : "") +
        sec("자격·수상", e.credentials && e.credentials.length ? '<ul class="book-list">' + list(e.credentials, function (c) {
          return '<li style="grid-template-columns:1fr"><span>' + esc(c) + "</span></li>";
        }) + "</ul>" : "") +
        sec("학력", e.education && e.education.length ? '<ul class="book-list">' + list(e.education, function (c) {
          return '<li style="grid-template-columns:1fr"><span>' + esc(c) + "</span></li>";
        }) + "</ul>" : "") +
        sec("칼럼·연재", e.articles && e.articles.length ? '<ul class="art-list">' + list(e.articles, function (a) {
          return a.url ? '<li><a href="' + esc(a.url) + '" target="_blank" rel="noopener"><span>' + esc(a.title) + ' ↗</span><span class="k">' + esc(a.kind) + "</span></a></li>"
            : '<li><a><span>' + esc(a.title) + '</span><span class="k">' + esc(a.kind) + "</span></a></li>";
        }) + "</ul>" : "") +
      "</div>" +
      '<aside class="aside-card"><span class="label">강의·자문 요청</span><h3>' + esc(e.name) + " 강사에게 강의를 요청하세요</h3>" +
        "<p>주제, 대상, 일정을 알려 주시면 자기분야가 일정을 조율해 연결해 드립니다.</p>" +
        '<a class="btn primary" href="contact.html#lecture-' + esc(e.id) + '">강의 문의하기</a>' +
        (e.articles && e.articles.length ? '<a class="btn" href="' + esc(e.articles[0].url) + '" target="_blank" rel="noopener">칼럼 읽기 ↗</a>' : "") +
      "</aside>";
    document.getElementById("others").innerHTML = all.filter(function (x) { return x.id !== e.id; }).slice(0, 3).map(window.expertCard).join("");
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
