<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전문가 프로필 | 자기분야</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="자기분야가 소개한 전문가의 프로필과 강의 주제입니다.">
<meta property="og:site_name" content="자기분야">
<meta property="og:title" content="전문가 프로필 | 자기분야">
<meta property="og:description" content="자기분야가 소개한 전문가의 프로필과 강의 주제입니다.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="expert.html">
<header id="site-header" class="site-header"></header>
<main id="main">
<section class="page-head">
  <div class="wrap">
    <nav class="crumbs" aria-label="현재 위치"><a href="index.html">홈</a><span aria-hidden="true">/</span><a href="experts.html">전문가·강사</a><span aria-hidden="true">/</span><span id="crumb">프로필</span></nav>
    <div class="profile" id="profile"></div>
  </div>
</section>
<section class="block">
  <div class="wrap detail-grid" id="detail"></div>
</section>
<section class="block alt">
  <div class="wrap">
    <div class="sec-head"><div><span class="label">다른 전문가</span><h2 class="hl">함께 소개된 전문가</h2></div><a class="more" href="experts.html">전체 보기 →</a></div>
    <div class="ex-grid" id="others"></div>
  </div>
</section>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="assets/experts.js"></script>
<script src="assets/site.js"></script>
<script>
(function () {
  var all = window.EXPERTS, F = window.EXPERT_FIELDS, esc = window.esc;
  function render() {
    var id = decodeURIComponent(location.hash.slice(1));
    var e = all.filter(function (x) { return x.id === id; })[0] || all[0];
    document.title = e.role + " | 자기분야";
    document.getElementById("crumb").textContent = e.role;
    document.getElementById("profile").innerHTML =
      '<span class="avatar lg">' + esc(e.initial) + "</span><div>" +
      '<span class="label">' + esc(F[e.field]) + "</span>" +
      '<h1 class="hl">' + esc(e.name) + "</h1>" +
      '<div class="role">' + esc(e.role) + "</div>" +
      '<div class="stats"><span class="tag">' + esc(F[e.field]) + '</span><span class="tag plain">경력 ' + esc(e.years) + "년</span><span class=\"tag plain\">강의 주제 " + e.topics.length + "개</span></div></div>";
    document.getElementById("detail").innerHTML =
      "<div>" +
        "<section><h2>소개</h2><p class=\"prose\" style=\"margin:0\">" + esc(e.summary) + "</p></section>" +
        "<section><h2>강의 주제</h2>" + e.topics.map(function (t) {
          return '<div class="lecture"><b>' + esc(t.title) + "</b><span>대상 " + esc(t.target) + " · " + esc(t.length) + "</span></div>";
        }).join("") + "</section>" +
        "<section><h2>주요 경력</h2><ul class=\"timeline\">" + e.career.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ul></section>" +
        "<section><h2>자기분야에 소개된 글</h2><ul class=\"art-list\">" + e.articles.map(function (a) {
          return '<li><a href="' + esc(a.url) + '" target="_blank" rel="noopener"><span>' + esc(a.title) + ' ↗</span><span class="k">' + esc(a.kind) + "</span></a></li>";
        }).join("") + "</ul></section>" +
      "</div>" +
      '<aside class="aside-card"><span class="label">강의·자문 요청</span><h3>이 전문가에게 강의를 요청하세요</h3>' +
        "<p>주제, 대상, 일정을 알려 주시면 자기분야가 전문가와 일정을 조율해 연결해 드립니다.</p>" +
        '<a class="btn primary" href="contact.html#lecture-' + esc(e.id) + '">강의 문의하기</a>' +
        '<a class="btn" href="' + esc(e.articles[0] ? e.articles[0].url : window.SITE.newsUrl) + '" target="_blank" rel="noopener">칼럼 읽기 ↗</a></aside>';
    document.getElementById("others").innerHTML = all.filter(function (x) { return x.id !== e.id; }).slice(0, 3).map(window.expertCard).join("");
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
