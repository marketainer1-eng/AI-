<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>셀러체크 · 내 진단 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --primary:#4F46E5; --primary-light:#EEF2FF; --primary-dark:#3730A3;
  --success:#10B981; --warning:#F59E0B; --danger:#EF4444;
  --gray-50:#F9FAFB; --gray-100:#F3F4F6; --gray-200:#E5E7EB;
  --gray-400:#9CA3AF; --gray-500:#6B7280; --gray-600:#4B5563;
  --gray-700:#374151; --gray-800:#1F2937; --gray-900:#111827;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#F8F9FF;color:var(--gray-800);min-height:100vh;font-size:16px}

/* 헤더 */
.header{background:#fff;border-bottom:1px solid var(--gray-200);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:22px;font-weight:800;color:var(--primary);letter-spacing:-.5px;text-decoration:none}
.logo span{color:var(--gray-400);font-weight:400;font-size:14px;margin-left:8px}
.header-right{display:flex;align-items:center;gap:12px}
.btn-back{display:flex;align-items:center;gap:6px;padding:8px 16px;border:1.5px solid var(--gray-200);border-radius:10px;background:#fff;cursor:pointer;font-size:14px;font-weight:600;color:var(--gray-600);font-family:inherit;transition:.2s;text-decoration:none}
.btn-back:hover{border-color:var(--primary);color:var(--primary)}

/* 페이지 전환 */
.page{display:none}.page.active{display:block}

/* 진단 기록 목록 */
.wrap{max-width:860px;margin:0 auto;padding:40px 24px 80px}
.page-title{font-size:26px;font-weight:800;color:var(--gray-900);margin-bottom:6px;letter-spacing:-.5px}
.page-sub{font-size:15px;color:var(--gray-500);margin-bottom:32px}
.user-card{background:#fff;border:1.5px solid var(--primary-light);border-radius:16px;padding:20px 24px;margin-bottom:28px;display:flex;align-items:center;gap:16px}
.user-avatar{width:48px;height:48px;background:var(--primary-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.user-info h3{font-size:17px;font-weight:700;color:var(--gray-900)}
.user-info p{font-size:14px;color:var(--gray-500);margin-top:2px}
.badge-provider{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;margin-left:8px;vertical-align:middle}
.bp-email{background:#f1f5f9;color:#475569}
.bp-google{background:#EBF3FE;color:#4285F4}
.bp-naver{background:#E8F9EE;color:#03C75A}
.bp-kakao{background:#FFFDE7;color:#191919}

/* 진단 카드 목록 */
.hist-grid{display:flex;flex-direction:column;gap:16px}
.hist-card{background:#fff;border:1.5px solid var(--gray-200);border-radius:16px;padding:22px 24px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:20px}
.hist-card:hover{border-color:var(--primary);box-shadow:0 4px 20px rgba(79,70,229,.1);transform:translateY(-1px)}
.hist-num{width:36px;height:36px;background:var(--primary-light);color:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.hist-info{flex:1;min-width:0}
.hist-date{font-size:13px;color:var(--gray-400);margin-bottom:4px;font-weight:500}
.hist-level{font-size:16px;font-weight:700;color:var(--gray-900);margin-bottom:6px}
.hist-bars{display:flex;gap:4px;flex-wrap:wrap}
.hbar{height:6px;border-radius:3px;min-width:20px}
.hist-score{text-align:right;flex-shrink:0}
.hist-score-num{font-size:24px;font-weight:800;color:var(--primary)}
.hist-score-num span{font-size:13px;font-weight:500;color:var(--gray-400)}
.hist-score-pct{font-size:13px;color:var(--gray-400);margin-top:2px}
.hist-arrow{color:var(--gray-300);font-size:18px;flex-shrink:0}
.empty-state{text-align:center;padding:80px 20px;color:var(--gray-400)}
.empty-state .icon{font-size:56px;margin-bottom:16px}
.empty-state p{font-size:16px;line-height:1.6}
.btn-go{display:inline-block;margin-top:20px;background:var(--primary);color:#fff;padding:14px 32px;border-radius:12px;text-decoration:none;font-weight:700;font-size:15px}

/* 상세 리포트 */
.report-header{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;padding:36px 32px;border-radius:20px;margin-bottom:24px}
.report-header h2{font-size:24px;font-weight:800;margin-bottom:8px}
.report-header p{font-size:15px;opacity:.85}
.score-hero{display:flex;align-items:center;gap:24px;margin-top:20px;flex-wrap:wrap}
.score-big{font-size:56px;font-weight:800;line-height:1}
.score-big span{font-size:18px;font-weight:500;opacity:.8}
.level-badge{display:inline-block;background:rgba(255,255,255,.2);padding:8px 18px;border-radius:20px;font-size:15px;font-weight:700}

/* 탭 */
.tabs{display:flex;gap:4px;background:#fff;border:1.5px solid var(--gray-200);border-radius:14px;padding:6px;margin-bottom:24px}
.tab{flex:1;padding:10px;border-radius:10px;border:none;background:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--gray-500);font-family:inherit;transition:.2s}
.tab.active{background:var(--primary);color:#fff}

/* 섹션 카드 */
.section-card{background:#fff;border:1.5px solid var(--gray-200);border-radius:16px;padding:24px;margin-bottom:16px}
.section-card h3{font-size:16px;font-weight:700;color:var(--gray-900);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.score-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.score-lbl{width:120px;font-size:13px;font-weight:600;color:var(--gray-700);flex-shrink:0}
.score-track{flex:1;height:8px;background:var(--gray-100);border-radius:100px;overflow:hidden}
.score-bar{height:100%;border-radius:100px;transition:width .8s ease}
.bar-g{background:#10B981}.bar-y{background:#F59E0B}.bar-r{background:#EF4444}
.score-pct{width:40px;font-size:13px;font-weight:700;text-align:right;flex-shrink:0}

/* Q&A 상세 */
.qa-section{margin-bottom:24px}
.qa-section h4{font-size:14px;font-weight:700;color:var(--primary);border-left:3px solid var(--primary);padding-left:10px;margin-bottom:12px}
.qa-item{background:var(--gray-50);border-radius:10px;padding:14px 16px;margin-bottom:8px}
.qa-q{font-size:14px;font-weight:600;color:var(--gray-700);margin-bottom:6px}
.qa-a{font-size:14px;color:var(--gray-500);display:flex;align-items:flex-start;gap:8px}
.qa-a::before{content:'→';color:var(--primary);font-weight:700;flex-shrink:0}

/* 로딩 */
.loading{text-align:center;padding:80px 20px;color:var(--gray-400)}
.spinner{width:40px;height:40px;border:4px solid var(--gray-200);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 인쇄 버튼 */
.fab-print{position:fixed;bottom:32px;right:32px;background:var(--primary);color:#fff;border:none;border-radius:50px;padding:14px 22px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 24px rgba(79,70,229,.4);display:flex;align-items:center;gap:8px;font-family:inherit;z-index:200;transition:.2s}
.fab-print:hover{background:var(--primary-dark);transform:translateY(-2px)}

/* 차트 */
.chart-wrap{height:300px;position:relative;margin-top:8px}

@media(max-width:600px){
  .header{padding:14px 16px}
  .wrap{padding:24px 16px 80px}
  .hist-card{padding:16px}
  .score-lbl{width:90px;font-size:12px}
  .score-big{font-size:42px}
}

@media print {
  .header,.fab-print,.tabs,.btn-back{display:none!important}
  .page{display:block!important}
  #pg-list{display:none!important}
  .section-card{break-inside:avoid}
}
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">셀러체크 <span>내 진단 기록</span></a>
  <div class="header-right">
    <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> 홈으로</a>
  </div>
</header>

<!-- ══════ 목록 페이지 ══════ -->
<div id="pg-list" class="page active">
  <div class="wrap">
    <div id="loadingBlock" class="loading">
      <div class="spinner"></div>
      <p>진단 기록을 불러오는 중...</p>
    </div>
    <div id="listContent" style="display:none">
      <h1 class="page-title">📋 내 진단 기록</h1>
      <p class="page-sub" id="listSub"></p>
      <div class="user-card" id="userCard"></div>
      <div class="hist-grid" id="histGrid"></div>
    </div>
    <div id="noAccessBlock" class="empty-state" style="display:none">
      <div class="icon">📭</div>
      <p>진단 기록을 찾을 수 없습니다.<br>올바른 기록 링크로 접근해 주세요.</p>
      <a href="index.html" class="btn-go">홈으로 돌아가기</a>
    </div>
  </div>
</div>

<!-- ══════ 상세 리포트 페이지 ══════ -->
<div id="pg-detail" class="page">
  <div class="wrap">
    <button class="btn-back" onclick="showList()" style="margin-bottom:20px;border:none;display:inline-flex"><i class="fas fa-arrow-left"></i> 목록으로</button>
    <div id="reportContent"></div>
  </div>
</div>

<button class="fab-print" id="printBtn" style="display:none" onclick="window.print()">
  <i class="fas fa-print"></i> 출력하기
</button>

<script>
// ══════════════════════════════════════
// 진단 영역 맵
// ══════════════════════════════════════
const SMAP = {
  ai:      {name:'AI 도구 활용',    icon:'🤖', qs:['Q4','Q5','Q6','Q7','Q8'], max:25},
  ch:      {name:'채널 전략',        icon:'📡', qs:['Q9','Q10','Q11','Q12','Q13'], max:25},
  rev:     {name:'수익 구조 설계',  icon:'💰', qs:['Q14','Q15','Q16','Q17','Q18'], max:25},
  seo:     {name:'상품 정보 & SEO', icon:'🔍', qs:['Q19','Q20','Q21','Q22','Q23'], max:25},
  detail:  {name:'상세페이지 & 카피', icon:'📝', qs:['Q24','Q25','Q26','Q27','Q28'], max:25},
  mkt:     {name:'마케팅 & 광고',   icon:'📣', qs:['Q29','Q30','Q31','Q32','Q33'], max:25},
  data:    {name:'성과 분석',        icon:'📊', qs:['Q34','Q35','Q36','Q37','Q38'], max:25},

  cs:      {name:'CS & 리뷰',       icon:'💬', qs:['Q44','Q45','Q46','Q47','Q48'], max:25},
  short:   {name:'숏폼 & 콘텐츠',  icon:'🎬', qs:['Q49','Q50','Q51','Q52','Q53'], max:25},
  risk:    {name:'리스크 관리',      icon:'🛡️', qs:['Q54','Q55','Q56','Q57','Q58'], max:25},
  plan:    {name:'30일 실행 계획',  icon:'📅', qs:['Q59','Q60','Q61','Q62','Q63'], max:25}
};

const QS_TEXT = {
  Q4:'AI 도구(ChatGPT 등)에 대해 얼마나 알고 계신가요?',

function getParam(name) {
  return new URLSearchParams(location.search).get(name);
}
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function fmtDate(ms) {
  if (!ms) return '–';
  const d = new Date(Number(ms));
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function levelColor(lv) {
  if (!lv) return '#9CA3AF';
  if (lv.includes('전문가')) return '#6D28D9';
  if (lv.includes('운영')) return '#2563EB';
  if (lv.includes('성장')) return '#059669';
  if (lv.includes('준비')) return '#D97706';
  return '#EF4444';
}

// 메인 로직
// ══════════════════════════════════════
let allDiagnoses = [];
let currentDiag = null;
let radarChart = null;

async function init() {
  // URL 파라미터
  const memberId = getParam('member_id');
  const diagId   = getParam('diag_id');

  if (!memberId) {
    document.getElementById('loadingBlock').style.display = 'none';
    document.getElementById('noAccessBlock').style.display = 'block';
    return;
  }

  const targetId = memberId;

  // 진단 기록 로드
  try {
    const res = await fetch(`tables/diagnoses?limit=100`).then(r=>r.json());
    const allRecs = res.data || [];
    allDiagnoses = allRecs
      .filter(d => d.member_id === targetId)
      .sort((a,b) => (b.diagnosed_at||0) - (a.diagnosed_at||0));
  } catch(e) {
    console.warn('기록 로드 실패', e);
  }

  document.getElementById('loadingBlock').style.display = 'none';
  document.getElementById('listContent').style.display = 'block';
  showPage('pg-list');

  renderUserCard();
  renderList();

  // 특정 진단 바로 보기
  if (diagId) {
    const target = allDiagnoses.find(d => d.id === diagId);
    if (target) showDetail(target);
  }
}

function renderUserCard() {
  // 로그인 기능 제거 — 진단 기록에서 회원 정보 도출
  const rec = allDiagnoses[0];
  if (!rec) return;
  document.getElementById('userCard').innerHTML = `
    <div class="user-avatar">👤</div>
    <div class="user-info">
      <h3>${rec.member_name || '–'}님</h3>
      <p>${rec.member_org || ''} ${rec.member_phone ? '· '+rec.member_phone : ''} ${rec.member_email ? '· '+rec.member_email : ''}</p>
    </div>
  `;
}

function renderList() {
  const grid = document.getElementById('histGrid');
  document.getElementById('listSub').textContent = `총 ${allDiagnoses.length}건의 진단 기록`;

  if (allDiagnoses.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="background:#fff;border:1.5px solid var(--gray-200);border-radius:16px;padding:60px">
      <div class="icon">📋</div>
      <p>아직 진단 기록이 없습니다.<br>셀러체크 무료 진단을 시작해보세요!</p>
      <a href="index.html" class="btn-go">무료 진단 시작하기</a>
    </div>`;
    return;
  }

  grid.innerHTML = allDiagnoses.map((d, i) => {
    let secScores = {};
    try { secScores = JSON.parse(d.sec_scores||'{}'); } catch(e) {}
    const bars = Object.entries(SMAP).map(([k, info]) => {
      const pct = secScores[k]?.pct || 0;
      const color = pct >= 71 ? '#10B981' : pct >= 41 ? '#F59E0B' : '#EF4444';
      const w = Math.max(8, Math.round(pct * 0.5));
      return `<div class="hbar" style="width:${w}px;background:${color}"></div>`;
    }).join('');
    const lc = levelColor(d.level);
    return `<div class="hist-card" onclick="showDetail(allDiagnoses[${i}])">
      <div class="hist-num">${allDiagnoses.length - i}</div>
      <div class="hist-info">
        <div class="hist-date">🕐 ${fmtDate(d.diagnosed_at)}</div>
        <div class="hist-level" style="color:${lc}">${d.level || '–'}</div>
        <div class="hist-bars">${bars}</div>
      </div>
      <div class="hist-score">
        <div class="hist-score-num">${d.total_score || 0}<span>/${d.total_max || 298}</span></div>
        <div class="hist-score-pct">${d.total_pct || 0}%</div>
      </div>
      <div class="hist-arrow"><i class="fas fa-chevron-right"></i></div>
    </div>`;
  }).join('');
}

function showList() {
  showPage('pg-list');
  document.getElementById('printBtn').style.display = 'none';
}

function showDetail(diag) {
  currentDiag = diag;
  showPage('pg-detail');
  document.getElementById('printBtn').style.display = 'flex';
  renderReport(diag);
  window.scrollTo(0, 0);
}

let activeTab = 'summary';
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = c.dataset.tab === tab ? 'block' : 'none');
  if (tab === 'chart') setTimeout(drawCharts, 100);
}

  // 탭 버튼 상태 초기화
  activeTab = 'summary';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'summary'));
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = c.dataset.tab === 'summary' ? 'block' : 'none');
}

function drawCharts() {
  if (!currentDiag) return;
  let secScores = {};
  try { secScores = JSON.parse(currentDiag.sec_scores || '{}'); } catch(e) {}

  const labels = Object.values(SMAP).map(info => info.name);
  const data   = Object.keys(SMAP).map(k => secScores[k]?.pct || 0);
  const colors = data.map(p => p >= 71 ? 'rgba(16,185,129,.7)' : p >= 41 ? 'rgba(245,158,11,.7)' : 'rgba(239,68,68,.7)');

  // 레이더 차트
  const rCtx = document.getElementById('radarChart');
  if (rCtx) {
    if (radarChart) radarChart.destroy();
    radarChart = new Chart(rCtx, {
      type: 'radar',
      data: {
        labels,
        datasets: [{
          label: '준비도(%)',
          data,
          backgroundColor: 'rgba(79,70,229,.15)',
          borderColor: '#4F46E5',
          borderWidth: 2,
          pointBackgroundColor: '#4F46E5',
          pointRadius: 4
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { r: { min:0, max:100, ticks:{stepSize:25,font:{size:10}}, pointLabels:{font:{size:11}} } },
        plugins: { legend: { display: false } }
      }
    });
  }

  // 바 차트
  const bCtx = document.getElementById('barChart');
  if (bCtx) {
    if (window._barChart) window._barChart.destroy();
    window._barChart = new Chart(bCtx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{ label: '준비도(%)', data, backgroundColor: colors, borderRadius: 6 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        indexAxis: 'y',
        scales: { x: { min:0, max:100 } },
        plugins: { legend: { display: false } }
      }
    });
  }
}

// ──────────────────
init();
</script>
</body>
</html>
