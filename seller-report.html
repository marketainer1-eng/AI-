<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>셀러체크 · 셀러 진단 리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --primary:#4F46E5; --primary-light:#EEF2FF; --primary-dark:#3730A3;
  --success:#10B981; --warning:#F59E0B; --danger:#EF4444;
  --gray-50:#F9FAFB; --gray-100:#F3F4F6; --gray-200:#E5E7EB;
  --gray-400:#9CA3AF; --gray-500:#6B7280; --gray-600:#4B5563;
  --gray-700:#374151; --gray-800:#1F2937; --gray-900:#111827;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#F8F9FF;color:var(--gray-800);font-size:16px}

/* 화면용 헤더 */
.header{background:#fff;border-bottom:1px solid var(--gray-200);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:20px;font-weight:800;color:var(--primary);letter-spacing:-.5px;text-decoration:none}
.header-btns{display:flex;gap:10px}
.btn-outline{padding:8px 18px;border:1.5px solid var(--gray-200);border-radius:10px;background:#fff;cursor:pointer;font-size:14px;font-weight:600;color:var(--gray-600);font-family:inherit;transition:.2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{padding:10px 22px;background:var(--primary);border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;color:#fff;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.btn-primary:hover{background:var(--primary-dark)}

/* 로딩 */
.loading{text-align:center;padding:100px 20px;color:var(--gray-400)}
.spinner{width:40px;height:40px;border:4px solid var(--gray-200);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 전체 래퍼 */
.report-page{max-width:860px;margin:0 auto;padding:40px 24px 80px}

/* ════ 리포트 표지 ════ */
.cover{background:linear-gradient(135deg,#312e81,#4F46E5,#7C3AED);color:#fff;border-radius:20px;padding:48px 40px;margin-bottom:32px;position:relative;overflow:hidden}
.cover::before{content:'';position:absolute;top:-60px;right:-60px;width:240px;height:240px;background:rgba(255,255,255,.06);border-radius:50%}
.cover-badge{display:inline-block;background:rgba(255,255,255,.2);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:700;margin-bottom:20px}
.cover h1{font-size:30px;font-weight:800;line-height:1.3;margin-bottom:16px;position:relative}
.cover-meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px;position:relative}
.cover-meta-item label{font-size:12px;opacity:.7;display:block;margin-bottom:4px;font-weight:500}
.cover-meta-item value{font-size:15px;font-weight:700}

/* ════ 스코어 히어로 ════ */
.score-hero{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:28px}
.score-card{background:#fff;border:1.5px solid var(--gray-200);border-radius:16px;padding:24px;text-align:center}
.score-card .sc-label{font-size:13px;color:var(--gray-500);font-weight:500;margin-bottom:10px}
.score-card .sc-value{font-size:36px;font-weight:800;color:var(--primary);line-height:1}
.score-card .sc-value span{font-size:14px;font-weight:500;color:var(--gray-400)}
.score-card .sc-sub{font-size:13px;color:var(--gray-400);margin-top:6px}

/* ════ 영역별 점수 ════ */
.section-card{background:#fff;border:1.5px solid var(--gray-200);border-radius:16px;padding:24px;margin-bottom:20px}
.section-card h3{font-size:17px;font-weight:700;color:var(--gray-900);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.score-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.score-lbl{width:130px;font-size:13px;font-weight:600;color:var(--gray-700);flex-shrink:0}
.score-track{flex:1;height:10px;background:var(--gray-100);border-radius:100px;overflow:hidden}
.score-bar{height:100%;border-radius:100px;transition:width .8s ease}
.bar-g{background:#10B981}.bar-y{background:#F59E0B}.bar-r{background:#EF4444}
.score-pct{width:44px;font-size:13px;font-weight:700;text-align:right;flex-shrink:0}
.score-pts{width:50px;font-size:12px;color:var(--gray-400);text-align:right;flex-shrink:0}

/* ════ 강·약점 분석 ════ */
.strength-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.str-card{border-radius:12px;padding:18px}
.str-card.good{background:#F0FDF4;border:1.5px solid #BBF7D0}
.str-card.weak{background:#FEF2F2;border:1.5px solid #FECACA}
.str-card h4{font-size:14px;font-weight:700;margin-bottom:10px}
.str-card h4.good{color:#065F46}
.str-card h4.weak{color:#991B1B}
.str-item{font-size:14px;padding:6px 0;border-bottom:1px solid rgba(0,0,0,.05);display:flex;align-items:center;gap:8px}
.str-item:last-child{border-bottom:none}

/* ════ 추천 과정 ════ */
.rec-item{display:flex;align-items:flex-start;gap:14px;padding:14px;background:var(--gray-50);border-radius:12px;margin-bottom:10px}
.rec-num{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;margin-top:1px}
.rec-info h4{font-size:15px;font-weight:700;color:var(--gray-900);margin-bottom:3px}
.rec-info p{font-size:13px;color:var(--gray-500)}

/* ════ 차트 ════ */
.chart-wrap{height:320px;position:relative}
.chart-wrap2{height:260px;position:relative;margin-top:16px}

/* ════ 상세 Q&A ════ */
.qa-section{margin-bottom:24px}
.qa-section h4{font-size:14px;font-weight:700;color:var(--primary);background:var(--primary-light);padding:8px 14px;border-radius:8px;margin-bottom:10px}
.qa-item{padding:12px 14px;border-left:3px solid var(--gray-200);margin-bottom:6px;background:#fff;border-radius:0 8px 8px 0}
.qa-q{font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:4px}
.qa-a{font-size:13px;color:var(--gray-500)}
.qa-a strong{color:var(--primary)}

/* ════ 확인 서명 ════ */
.sign-area{background:#fff;border:1.5px solid var(--gray-200);border-radius:16px;padding:28px;margin-top:24px}
.sign-area h3{font-size:16px;font-weight:700;margin-bottom:20px;color:var(--gray-900)}
.sign-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.sign-field{border-bottom:1.5px solid var(--gray-300);padding-bottom:40px}
.sign-field label{font-size:12px;color:var(--gray-500);display:block;margin-bottom:6px}
.sign-field value{font-size:14px;font-weight:600;color:var(--gray-700)}

/* ════ 인쇄용 ════ */
@media print {
  .header,.header-btns{display:none!important}
  body{background:#fff}
  .report-page{padding:0;max-width:100%}
  .cover{border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .section-card,.score-card,.sign-area,.str-card{break-inside:avoid}
  .score-hero{grid-template-columns:1fr 1fr 1fr}
}

@media(max-width:600px){
  .header{padding:12px 16px}
  .report-page{padding:24px 14px 60px}
  .cover{padding:32px 20px}
  .cover h1{font-size:22px}
  .cover-meta{grid-template-columns:1fr}
  .score-hero{grid-template-columns:1fr}
  .strength-grid{grid-template-columns:1fr}
  .sign-row{grid-template-columns:1fr}
  .score-lbl{width:100px;font-size:12px}
}

.empty-state{text-align:center;padding:100px 20px;color:var(--gray-400)}
.empty-state .icon{font-size:56px;margin-bottom:16px}
.btn-go{display:inline-block;margin-top:20px;background:var(--primary);color:#fff;padding:14px 32px;border-radius:12px;text-decoration:none;font-weight:700;font-size:15px}
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">셀러체크</a>

  <div class="spinner"></div>

// 유틸

function getParam(n) { return new URLSearchParams(location.search).get(n); }
function fmtDate(ms) {
  if (!ms) return '–';
  const d = new Date(Number(ms));
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
}
function fmtDateTime(ms) {
  if (!ms) return '–';
  const d = new Date(Number(ms));
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function levelColor(lv) {
  if (!lv) return '#9CA3AF';
  if (lv.includes('전문가')) return '#6D28D9';
  if (lv.includes('운영')) return '#2563EB';
  if (lv.includes('성장')) return '#059669';
  if (lv.includes('준비')) return '#D97706';
  return '#EF4444';
}
function levelDesc(lv) {
  if (!lv) return '';
  if (lv.includes('전문가')) return '탁월한 역량을 갖추고 있습니다. 지도사 과정으로 전문성을 더 높여보세요.';
  if (lv.includes('운영')) return '상당한 역량을 갖추고 있습니다. 약점 영역을 집중 보완하면 전문가 수준으로 도약할 수 있습니다.';
  if (lv.includes('성장')) return '기초가 잘 갖춰져 있습니다. 취약 영역에 집중 투자하면 빠른 성장이 가능합니다.';
  if (lv.includes('준비')) return '기본기가 형성되고 있습니다. 체계적인 학습과 실습으로 역량을 쌓아가세요.';
  return '이제 시작 단계입니다. 기초부터 차근차근 학습하면 빠르게 성장할 수 있습니다.';
}

// 메인
// ══════════════════════════════════════
async function init() {
  const diagId = getParam('diag_id');
  const mode   = getParam('mode');

  // ── mode=temp : 세션 스토리지의 임시 결과 사용 (비로그인 포함)
  if (!diagId && mode === 'temp') {
    try {
      const raw = sessionStorage.getItem('sc_temp_result');
      if (!raw) { showError(); return; }
      const tempDiag = JSON.parse(raw);
      // 임시 결과엔 id가 없으므로 더미 추가
      tempDiag.id = 'TEMP-' + Date.now();
      document.getElementById('loadingBlock').style.display = 'none';
      document.getElementById('reportWrap').style.display = 'block';
      buildReport(tempDiag);
    } catch(e) {
      showError();
    }
    return;
  }

  if (!diagId) { showError(); return; }

  try {
    const diag = await fetch(`tables/diagnoses/${diagId}`).then(r => { if(!r.ok) throw new Error(); return r.json(); });
    if (!diag || !diag.id) { showError(); return; }

    document.getElementById('loadingBlock').style.display = 'none';
    document.getElementById('reportWrap').style.display = 'block';
    buildReport(diag);
    // 같은 회원의 진단 기록 목록 링크 (로그인 기능 제거 — member_id 기반)
    if (diag.member_id) {
      const listBtn = document.getElementById('listBtn');
      if (listBtn) {
        listBtn.href = `my-report.html?member_id=${diag.member_id}`;
        listBtn.style.display = '';
      }
    }
  } catch(e) {
    showError();
  }
}

function showError() {
  document.getElementById('loadingBlock').style.display = 'none';
  document.getElementById('errorBlock').style.display = 'block';
}

        </div>
      </div>
      <div style="margin-top:24px;padding:14px;background:#f8fafc;border-radius:10px;font-size:13px;color:#64748b;line-height:1.6">
        본 리포트는 셀러체크(SellerCheck) 플랫폼에서 생성된 개인 역량 진단 결과입니다.<br>
        ${d.id && !d.id.startsWith('TEMP-') ? `진단 ID: ${d.id} · ` : ''}생성 일시: ${fmtDateTime(d.diagnosed_at)}
      </div>
    </div>
  `;

  document.getElementById('reportBody').innerHTML = html;

  // 차트 그리기
  setTimeout(() => drawCharts(secScores), 200);
}

function drawCharts(secScores) {
  const labels = Object.values(SMAP).map(info => info.name);
  const data   = Object.keys(SMAP).map(k => secScores[k]?.pct || 0);

  const rCtx = document.getElementById('radarChart');
  if (!rCtx) return;

  new Chart(rCtx, {
    type: 'radar',
    data: {
      labels,
      datasets: [{
        label: '준비도(%)',
        data,
        backgroundColor: 'rgba(79,70,229,.15)',
        borderColor: '#4F46E5',
        borderWidth: 2.5,
        pointBackgroundColor: '#4F46E5',
        pointRadius: 5
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { r: { min:0, max:100, ticks:{stepSize:25,font:{size:10}}, pointLabels:{font:{size:11}} } },
      plugins: { legend: { display: false } }
    }
  });
}

init();
</script>
</body>
</html>
