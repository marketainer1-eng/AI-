[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docref"
version = "0.1.0"
description = "Document Reference Integrity Management System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "typer[all]>=0.12.3",
    "python-dotenv>=1.0.1",
    "python-docx>=1.1.2",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.3.0",
    "rich>=13.7.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "ruff>=0.4.7",
]

[project.scripts]
docref = "app.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["app/cli/*"]
