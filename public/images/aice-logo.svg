<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 36" fill="none">
  <!-- ===== 아이소메트릭 블록 아이콘 ===== -->
  <!-- 상단면 (다크 네이비 마름모) -->
  <polygon points="10,3 19,7.5 10,12 1,7.5" fill="#002D62"/>
  <!-- 상단면 중앙 핑크 다이아몬드 -->
  <polygon points="10,6 13,7.5 10,9 7,7.5" fill="#E25265"/>
  <!-- 왼쪽면 (진한 네이비) -->
  <polygon points="1,7.5 10,12 10,23 1,18.5" fill="#001640"/>
  <!-- 오른쪽면 (연한 슬레이트) -->
  <polygon points="19,7.5 10,12 10,23 19,18.5" fill="#dce6f0"/>
  <!-- 오른쪽면 핑크 세로 기둥 -->
  <polygon points="17,8.8 19,7.5 19,18.5 17,19.8" fill="#E25265"/>

  <!-- ===== AICE 텍스트 ===== -->
  <text x="26" y="20"
    font-family="'Arial Black', 'Franklin Gothic Heavy', Arial, sans-serif"
    font-weight="900"
    font-size="17"
    fill="#002D62"
    letter-spacing="0.3">AICE</text>
</svg>
